<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Scores Sportifs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .config-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
        }

        select:focus, input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .players-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .player-zone {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
        }

        .player-zone:last-child {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .player-zone h2 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-point {
            background: #ffffff;
            color: #f5576c;
        }

        .btn-bonus {
            background: #ffd93d;
            color: #333;
        }

        .player-zone:last-child .btn-point {
            color: #00f2fe;
        }

        .score-display {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #333;
        }

        .score-display label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-action {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-reset {
            background: #ff6b6b;
            color: white;
        }

        .btn-save {
            background: #51cf66;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .players-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Suivi des Scores Activités d'Opposition 🏆</h1>
        
        <div class="config-section">
            <div class="form-group">
                <label for="sport">🏃 Activité</label>
                <select id="sport">
                    <option value="">Sélectionner une activité</option>
                    <option value="Basketball">🏀 Basketball</option>
                    <option value="Handball">⚽️ Handball</option>
                    <option value="Volley-ball">🏐 Volley-ball</option>
                    <option value="Futsal">⚽️ Futsal</option>
                    <option value="Football">⚽️ Football</option>
                    <option value="Ultimate">🥏 Ultimate</option>
                    <option value="Tennis de table">🏓 Tennis de table</option>
                    <option value="Badminton">🏸 Badminton</option>
                    <option value="Pickelball">🎾 Pickelball</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">🗓 Date de la séance</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="bonus">⭐️ Points bonus</label>
                <select id="bonus">
                    <option value="-1">-1</option>
                    <option value="0" selected>0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>

        <div class="players-container">
            <div class="player-zone">
                <h2>👤 Joueur 1 / 👥️ Equipe 1</h2>
                <input type="text" id="prenom1" placeholder="nom">
                <div class="button-group">
                    <button class="btn btn-point" onclick="addPoint(1)">+1 Point</button>
                    <button class="btn btn-bonus" onclick="addBonus(1)">Bonus</button>
                </div>
                <div class="score-display">
                    <label>⭐️ Points bonus cumulés</label>
                    <div class="score-value" id="bonusTotal1">0</div>
                </div>
                <div class="score-display">
                    <label>🏅 Score total</label>
                    <div class="score-value" id="scoreTotal1">0</div>
                </div>
            </div>

            <div class="player-zone">
                <h2>👤 Joueur 2 / 👥️ Equipe 2</h2>
                <input type="text" id="prenom2" placeholder="nom">
                <div class="button-group">
                    <button class="btn btn-point" onclick="addPoint(2)">+1 Point</button>
                    <button class="btn btn-bonus" onclick="addBonus(2)">Bonus</button>
                </div>
                <div class="score-display">
                    <label>⭐️ Points bonus cumulés</label>
                    <div class="score-value" id="bonusTotal2">0</div>
                </div>
                <div class="score-display">
                    <label>🏅 Score total</label>
                    <div class="score-value" id="scoreTotal2">0</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-reset" onclick="resetAll()">Réinitialiser</button>
            <button class="btn-action btn-save" onclick="saveToSheets()">Enregistrer</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        // Variables pour stocker les données
        let player1 = { points: 0, bonus: 0 };
        let player2 = { points: 0, bonus: 0 };

        // Initialiser la date du jour
        document.getElementById('date').valueAsDate = new Date();

        function addPoint(player) {
            if (player === 1) {
                player1.points++;
            } else {
                player2.points++;
            }
            updateDisplay();
        }

        function addBonus(player) {
            const bonusValue = parseInt(document.getElementById('bonus').value);
            if (player === 1) {
                player1.bonus += bonusValue;
            } else {
                player2.bonus += bonusValue;
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('bonusTotal1').textContent = player1.bonus;
            document.getElementById('scoreTotal1').textContent = player1.points + player1.bonus;
            document.getElementById('bonusTotal2').textContent = player2.bonus;
            document.getElementById('scoreTotal2').textContent = player2.points + player2.bonus;
        }

        function resetAll() {
            if (confirm('Êtes-vous sûr de vouloir réinitialiser toutes les données ?')) {
                player1 = { points: 0, bonus: 0 };
                player2 = { points: 0, bonus: 0 };
                document.getElementById('prenom1').value = '';
                document.getElementById('prenom2').value = '';
                document.getElementById('sport').value = '';
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('bonus').value = '0';
                updateDisplay();
                hideMessage();
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        async function saveToSheets() {
            const sport = document.getElementById('sport').value;
            const date = document.getElementById('date').value;
            const prenom1 = document.getElementById('prenom1').value;
            const prenom2 = document.getElementById('prenom2').value;

            // Validation
            if (!sport || !date || !prenom1 || !prenom2) {
                showMessage('Veuillez remplir tous les champs obligatoires', 'error');
                return;
            }

            const scoreTotal1 = player1.points + player1.bonus;
            const scoreTotal2 = player2.points + player2.bonus;

            const data = {
                date: date,
                activite: sport,
                prenomJ1: prenom1,
                prenomJ2: prenom2,
                scoreJ1: scoreTotal1,
                scoreJ2: scoreTotal2,
                bonusJ1: player1.bonus,
                bonusJ2: player2.bonus
            };

            // URL de votre Google Apps Script Web App
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywzHrgUZC2aX8xozA-b63Nft2oLOCXZlRTHuJiYSIGF4RhtKBth8VSlLjYQwQ-eK-2/exec';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                showMessage('Données enregistrées avec succès !', 'success');
                
                // Réinitialiser après sauvegarde
                setTimeout(() => {
                    resetAll();
                }, 4000);

            } catch (error) {
                console.error('Erreur:', error);
                showMessage('Erreur lors de l\'enregistrement. Vérifiez la console.', 'error');
            }
        }
    </script>
</body>
</html>
